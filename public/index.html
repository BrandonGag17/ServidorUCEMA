
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrar planillas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #172033;
    }

    main {
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      text-align: center;
      background: white;
      border: 1px solid #e1e5ec;
      border-radius: 18px;
      box-shadow: 0 12px 35px #17203312;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 12px;
    }

    p {
      color: #657086;
      line-height: 1.5;
    }

    .description {
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    #download {
      background: #1769e0;
    }

    #download:hover {
      background: #1056bd;
    }

    #compare {
      background: #159447;
    }

    #compare:hover {
      background: #10783a;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      min-height: 20px;
      margin: 14px 0 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #dc2626;
    }

    .loading {
      color: #657086;
    }
  </style>
</head>

<body>

  <main>
    <div class="icon" aria-hidden="true">📊</div>

    <h1>Administrar planillas</h1>

    <p class="description">
      Descargá la planilla actualizada o compará los registros de las dos fuentes.
    </p>

    <div class="actions">

      <button id="download" type="button">
        ↓ Descargar Excel
      </button>

      <button id="compare" type="button">
        ⇄ Comparar planillas
      </button>

    </div>

    <p id="downloadStatus" class="status"
       role="status" aria-live="polite"></p>

    <p id="compareStatus" class="status"
       role="status" aria-live="polite"></p>

  </main>

  <script>
    const downloadButton = document.getElementById("download");
    const compareButton = document.getElementById("compare");

    const downloadStatus = document.getElementById("downloadStatus");
    const compareStatus = document.getElementById("compareStatus");

    // ==========================================
    // DESCARGAR EXCEL
    // ==========================================

    downloadButton.addEventListener("click", async () => {
      downloadButton.disabled = true;
      compareButton.disabled = true;

      downloadStatus.className = "status loading";
      downloadStatus.textContent = "Preparando el Excel...";

      try {
        const response = await fetch("/api/descargar");

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));

          throw new Error(
            data.error || "No se pudo descargar la planilla."
          );
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = "planilla.xlsx";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        downloadStatus.className = "status success";
        downloadStatus.textContent = "¡Descarga iniciada!";

      } catch (error) {
        downloadStatus.className = "status error";
        downloadStatus.textContent = error.message;

      } finally {
        downloadButton.disabled = false;
        compareButton.disabled = false;
      }
    });

    // ==========================================
    // COMPARAR PLANILLAS
    // ==========================================

    compareButton.addEventListener("click", async () => {
      const confirmar = confirm(
        "¿Querés comparar las dos planillas y actualizar la hoja de resultados?"
      );

      if (!confirmar) return;

      compareButton.disabled = true;
      downloadButton.disabled = true;

      compareStatus.className = "status loading";
      compareStatus.textContent = "Comparando planillas...";

      try {
        const response = await fetch("/api/comparar", {
          method: "POST"
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.error || "No se pudo completar la comparación."
          );
        }

        compareStatus.className = "status success";

        compareStatus.textContent =
          `¡Comparación finalizada! Se encontraron ${data.faltantes} registros faltantes.`;

      } catch (error) {
        compareStatus.className = "status error";
        compareStatus.textContent = error.message;

      } finally {
        compareButton.disabled = false;
        downloadButton.disabled = false;
      }
    });

  </script>

</body>
</html>
